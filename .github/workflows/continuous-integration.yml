name: 'Continuous Integration'

on: [pull_request, push]

permissions: read-all

jobs:
  ci-pipeline:
    name: 'Continuous Integration'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          submodules: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 11
      - name: 'Build cache'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: 'Check'
        run: ./gradlew check -x integrationTest
      - name: 'Integration test'
        run: ./gradlew :pushiko-apns:integrationTest :pushiko-fcm:integrationTest
      - name: 'Check semantic versioning'
        if: github.event_name == 'pull_request'
        run: ./gradlew checkSemver --no-configuration-cache
      - name: 'Archive semver reports'
        if: github.event_name == 'pull_request' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semver-reports
          path: '**/build/reports/japicmp/'
          if-no-files-found: ignore
      - name: 'Tear down'
        if: always()
        run: |
          ./gradlew --stop
