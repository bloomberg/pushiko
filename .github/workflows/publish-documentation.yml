name: 'Publish Documentation'

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

permissions: read-all

jobs:
  build:
    name: 'Build GitHub Pages artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: 'Set current year'
        run: echo "YEAR=$(date +'%Y')" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: 'Install documentation dependencies'
        run: python -m pip install --require-hashes -r docs/requirements.txt
      - name: 'Gradle'
        run: |
          echo 'org.gradle.caching=false' >> gradle.properties
          echo 'org.gradle.configuration-cache=false' >> gradle.properties
      - name: 'Dokka'
        run: |
          ./gradlew :dokkaGfmMultiModule :dokkaHtmlMultiModule
          cp -R build/dokka/gfmMultiModule docs/kdoc
          cp -R build/dokka/htmlMultiModule docs/kdoc/api
      - name: 'Set version'
        run: echo "VERSION=$(grep -hnr '^version=' gradle.properties | sed 's/.*=//')" >> "$GITHUB_ENV"
      - name: 'Mkdocs'
        run: |
          sed -i 's/<year>/${{ env.YEAR }}/g' docs/*.md
          sed -i 's/<year>/${{ env.YEAR }}/g' mkdocs.yml
          sed -i 's/{pushikoVersion}/${{ env.VERSION }}/g' docs/*.md
          mkdocs build
      - name: 'Upload GitHub Pages artifact'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: 'Deploy GitHub Pages artifact'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 'Deploy GitHub Pages artifact'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
